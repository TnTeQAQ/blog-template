# GitHub Pages deployment workflow.
#
# It stays DORMANT until you opt in by creating the Actions variable
# `ENABLE_PAGES = true` (Settings → Secrets and variables → Actions →
# Variables), so the template repo itself never runs a deployment.
#
# After enabling, also set: Settings → Pages → Build and deployment →
# Source → GitHub Actions.
#
# Project page (https://USER.github.io/REPO/): additionally set VITE_BASE
# below or as another Actions variable to /REPO/. Root domain /
# <user>.github.io / custom domain: leave it at '/'.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.ENABLE_PAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE: ${{ vars.VITE_BASE || '/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deep links use real paths (/archive, /posts/<slug>, …). GitHub Pages
      # has no SPA rewrite rules, so it serves 404.html for unknown paths —
      # reuse the built entry so the app boots and the router resolves the
      # path; hashed asset URLs stay valid and it doubles as a branded 404.
      - name: Provide SPA fallback / branded 404
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
